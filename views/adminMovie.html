<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Form</title>
</head>
<body>
    <h1>Add New Movie</h1>
    <form id="movieAdd">

        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title" required><br><br>

        <label for="releaseYear">Release Year:</label><br>
        <input type="number" id="releaseYear" name="releaseYear" required><br><br>

        <label for="description">Description:</label><br>
        <textarea id="description" name="description"></textarea><br><br>

        <label for="thumbnail">Thumbnail:</label><br>
        <input type="file" id="thumbnail" name="thumbnail" accept="image/*"><br><br>

        <label for="cbfc">CBFC Rating:</label><br>
        <select id="cbfc" name="cbfc">
            <option value="U">U (Universal)</option>
            <option value="U/A">U/A (Parental Guidance)</option>
            <option value="A">A (Adult)</option>
            <option value="A+">A+ (Adult Above 18)</option>
        </select><br><br>

        <label for="isSeries">Is Series?</label><br>
        <input type="checkbox" id="isSeries" name="isSeries" onclick="toggleSeasonIndex()"><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    $(document).ready(function () {
    $('#movieAdd').on('submit', function (e) {
        e.preventDefault();

        const title = $('#title').val().trim();
        const releaseYear = $('#releaseYear').val().trim();
        const description = $('#description').val().trim();
        const cbfc = $('#cbfc').val();
        const isSeries = $('#isSeries').prop('checked');

        if (!title || !releaseYear) {
            alert('Title and Release Year are required!');
            return;
        }

        var formData = new FormData();
        formData.append('file', $('#thumbnail')[0].files[0]);

        $.ajax({
            url: 'https://linggrani.com/uploadsThumbnail.php',
            type: 'POST',
            data: formData,
            contentType: false,
            processData: false,
            success: function(response) {
                var data = JSON.parse(response);
                if (data.success) {
                    console.log('File uploaded successfully. File URL: ' + data.fileName);
                    const thumbnailFile = data.fileName;

                    sendMovieData(thumbnailFile);
                } else {
                    console.log('Error: ' + data.message);
                }
            },
            error: function(xhr, status, error) {
                console.log('Error during the upload: ' + error);
            }
        });

        function sendMovieData(thumbnailFile) {
            const movieData = {
                title: title,
                releaseYear: releaseYear,
                description: description,
                cbfc: cbfc,
                isSeries: isSeries,
                thumbnail: thumbnailFile,
            };

            $.ajax({
                url: '/admin-crud/movie',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(movieData),
                success: function (response) {
                    console.log('Movie added successfully:', response);
                    location.reload();
                },
                error: function (error) {
                    console.error("Error adding movie:", error.responseText);
                }
            });
        }
    });
});

</script>
</html>
